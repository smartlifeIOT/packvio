# Content-Security-Policy — REPORT-ONLY until proven clean.
#
# ============================================================================
# WHY REPORT-ONLY FIRST
#
# An enforced CSP that is one directive too tight does not degrade: it silently
# blocks a script, and the RFQ form — the site's only conversion — stops
# submitting for every visitor while the server logs nothing at all. The failure
# is invisible from the outside and looks like "nobody is enquiring this week".
# Report-Only sends the identical policy, blocks nothing, and reports every
# violation to the browser console, so the policy can be proven against the real
# site before it is given the power to break it.
#
# HOW TO PROMOTE IT (do not skip the middle step):
#   1. Deploy with this file as-is.
#   2. Walk the site in a browser with the console open: home, a category, a
#      product, /quote, /contact, and SUBMIT A REAL RFQ. Watch for
#      "Content-Security-Policy-Report-Only" violations.
#   3. If there are none, swap the header name below from
#      `Content-Security-Policy-Report-Only` to `Content-Security-Policy`,
#      `nginx -t`, and reload. Keep the directives identical — a policy edited
#      at the same moment it is enforced has not been tested.
#
# WHAT WAS MEASURED BEFORE WRITING THIS
#
# The policy below was checked against the running stack by loading every page
# with the browser console captured. The findings, and why each directive is the
# width it is:
#
#   'unsafe-inline' in script-src — REQUIRED, and the one directive worth
#       removing later. Next.js inlines its bootstrap and the streamed RSC
#       payload as inline <script> elements, and the pages also emit JSON-LD in
#       inline <script type="application/ld+json">. Removing it needs a
#       per-request nonce threaded from middleware into next.config's CSP
#       support; that is a piece of work in its own right, not a directive edit.
#
#   'unsafe-inline' in style-src — REQUIRED. next/font emits an inline <style>
#       block for its @font-face declarations, and React writes inline style
#       attributes for the drift's per-column transforms and durations.
#
#   img-src — 'self' and data: cover the site as it stands today, because there
#       is no product photography yet. The three Salla CDN hosts are listed
#       ahead of that changing: they are already in next.config.ts's
#       remotePatterns, so the day a synced product image appears it will load
#       rather than being blocked by a policy nobody thought to update.
#
#   frame-src — the contact page embeds an OpenStreetMap iframe. It is
#       OpenStreetMap rather than Google precisely so no consent banner is
#       needed (see CLAUDE.md); this is the directive that permits it.
#
#   connect-src 'self' — the RFQ now posts to the site's own origin, and the
#       header autocomplete goes through /api/suggest. Nothing in the browser
#       talks to another origin any more, which is a direct benefit of moving
#       the quote submission server-side.
#
#   frame-ancestors 'none' — nothing may embed this site. Clickjacking a form
#       whose submit button sends a business's contact details is the attack
#       this closes.
#
#   form-action 'self' — a form on this site may only post back to it. Limits
#       what an injected <form> could do with what a buyer has typed.
#
#   base-uri 'self' — an injected <base href> would otherwise silently
#       re-point every relative URL on the page, including the RFQ endpoint.
#
#   object-src 'none' — no Flash, no <embed>, no plugin content. Nothing on
#       this site uses any, and it is a classic bypass vector.
#
# NOTE ON THIS FILE'S PLACE IN THE CASCADE: it is included alongside
# security-headers.conf in every location, for the add_header inheritance reason
# documented there.

add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.salla.sa https://cdn.assets.salla.network https://i.salla.sa; font-src 'self'; connect-src 'self'; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
