# Shared proxy headers.
#
# THE CLIENT IP CONTRACT LIVES HERE, and the RFQ rate limit depends on it being
# exactly right. Read this before changing a line of it.
#
# The chain is:
#
#     browser -> nginx -> web (Next)  -> api      for the RFQ POST
#     browser -> nginx -> api                     for everything else under /api/
#
# Express in the API runs with `trust proxy = 1`: it trusts ONE hop and reads the
# client as the last untrusted entry in X-Forwarded-For. For that to be the real
# submitter, the header must contain exactly one address in both chains.
#
#   X-Forwarded-For $remote_addr    <- overwrite, NOT $proxy_add_x_forwarded_for
#
# $proxy_add_x_forwarded_for APPENDS to whatever the client sent, so a request
# carrying a forged `X-Forwarded-For: 1.2.3.4` arrives at the API as
# "1.2.3.4, <real ip>". With `trust proxy = 1` that still resolves correctly
# today — but it makes the count of entries depend on the caller, and the
# invariant the API relies on is no longer "exactly one". Overwriting makes the
# header mean one thing: the address nginx actually accepted the connection
# from, which is the only address in the chain that cannot be forged.
#
# The Next route handler at /api/quote then forwards this header UNCHANGED
# rather than appending its own hop — see apps/web/src/app/api/quote/route.ts.
# Append there and every RFQ in the world shares one rate-limit bucket.
#
# Hop count, stated plainly: ONE trusted proxy from the API's point of view, on
# both paths. `trust proxy = 1` in apps/api/src/main.ts is correct as written and
# must not be raised to `true` — trusting the whole chain lets a caller mint a
# fresh identity per request by prepending an address, which is the rate limit
# switched off.
#
# If a CDN is ever put in front of nginx, this is the file that has to change:
# the real client would then be in the header the CDN sends, `$remote_addr`
# would be the CDN's edge, and both this line and `trust proxy` would need to
# account for the extra hop.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Lets nginx reuse upstream connections; without it every proxied request opens
# a new TCP connection to Next, which on a keep-alive-heavy page is most of the
# per-request cost.
proxy_set_header Connection '';

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Don't let an upstream error page replace the app's own. Next renders a styled
# 404 and a real error boundary; nginx's default is a white page saying nginx.
proxy_intercept_errors off;
