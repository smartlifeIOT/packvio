# Security headers, plus the staging no-index header.
#
# ============================================================================
# THIS FILE MUST BE INCLUDED IN EVERY LOCATION THAT SETS ANY add_header OF ITS
# OWN. That is not tidiness — it is how nginx works, and it is the single most
# common way a header set is silently lost.
#
# add_header directives are inherited from an enclosing block ONLY IF the inner
# block declares none itself. Add one `add_header Cache-Control ...` inside a
# location and every header from the server block stops applying to that
# location — no warning, no error, `nginx -t` passes. The static-asset location
# below would quietly serve without X-Frame-Options or the CSP.
#
# `always` is on every one of them so they are also sent on error responses. A
# 404 or a 502 is still a response a browser renders.
# ============================================================================

# HSTS.
#
# IT LIVES IN THIS SNIPPET, not in the server block, and that placement was a
# bug found by testing rather than a preference. Declared once at server level
# it was inherited by nothing: every location here sets add_headers of its own,
# which replaces the inherited set wholesale, so the live site sent no
# Strict-Transport-Security at all while the config looked correct and
# `nginx -t` passed. It is exactly the trap described below, and it caught the
# person writing the warning about it.
#
# Every include of this file is inside the TLS server. Should one ever be added
# to a plain-HTTP block, the header is ignored by specification rather than
# harmful.
#
# NO `preload`, and no `includeSubDomains` on a staging host. Preloading is
# submitted to a browser-vendor list and is effectively PERMANENT: it would
# commit every subdomain of this apex to HTTPS-only in shipped browsers,
# including ones that do not exist yet, and removal takes months. Six months of
# max-age protects this host without betting the domain on it.
add_header Strict-Transport-Security "max-age=15768000" always;

# Stops a browser from second-guessing a declared Content-Type. Without it, a
# response typed text/plain that happens to contain markup can be sniffed as
# HTML and executed.
add_header X-Content-Type-Options "nosniff" always;

# Legacy twin of frame-ancestors below. Kept for older browsers that do not
# implement CSP Level 2; modern ones use the CSP directive and ignore this.
add_header X-Frame-Options "DENY" always;

# Send the full URL only to ourselves; send the origin alone cross-site, and
# nothing at all when leaving HTTPS. Product URLs carry Arabic slugs and RFQ
# pages carry a `?code=` — neither should reach a third party in a Referer.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing on this site uses a camera, a microphone or a location. Saying so
# denies them to any embedded third-party frame as well.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# ---------------------------------------------------------------------------
# STAGING ONLY — keep this site out of every index.
#
# Belt and braces with robots.txt, and the stronger of the two: robots.txt asks
# a crawler not to FETCH a page, while this tells one that has already fetched
# it not to index it. A page linked from somewhere else can be indexed without
# its robots.txt ever being read; this header is what stops that.
#
# DELETE THIS LINE WHEN THIS CONFIG IS USED FOR PRODUCTION. Shipping it to
# production removes the site from Google, and the symptom appears weeks later.
# ---------------------------------------------------------------------------
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
