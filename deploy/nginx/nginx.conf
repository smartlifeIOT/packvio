# Packvio edge — main nginx configuration.
# The site itself lives in http.d/packvio.conf, rendered from
# templates/packvio.conf.template at container start.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

# Alpine ships Brotli as two DYNAMIC modules and both are required: the filter
# compresses responses generated by nginx, and the static module serves a
# precompressed .br file when one exists. Loading only the filter is a common
# half-configuration that appears to work.
load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $upstream_cache_status and the request time are here because the questions
    # asked of a staging log are "did this hit the cache" and "what was slow",
    # and neither is answerable from the combined format.
    log_format packvio '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'xff="$http_x_forwarded_for" rt=$request_time urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log packvio;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # An RFQ with a long message and a dozen lines is still only a few KB; this
    # is generous for that and small enough that a body upload is not a DoS.
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # ---------------------------------------------------------------------
    # Compression
    #
    # Both, not either: Brotli is meaningfully denser on text and every current
    # browser takes it, but it is only offered over HTTPS by some clients and an
    # older client may send `Accept-Encoding: gzip` alone. Configuring one
    # leaves that traffic uncompressed.
    #
    # Images are absent from both type lists on purpose — JPEG, PNG, WebP and
    # AVIF are already compressed, and running them through a compressor spends
    # CPU to add bytes.
    # ---------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json
        image/svg+xml font/woff font/woff2;

    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_static on;
    brotli_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json
        image/svg+xml font/woff font/woff2;

    # ---------------------------------------------------------------------
    # TLS defaults, applied to every server block below.
    # ---------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Upstreams by service name — Docker's embedded DNS resolves them on the
    # `internal` network. Neither publishes a port to the host.
    upstream packvio_web {
        server web:3000;
        keepalive 32;
    }

    upstream packvio_api {
        server api:4000;
        keepalive 16;
    }

    include /etc/nginx/http.d/*.conf;
}
